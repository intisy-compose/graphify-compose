# Reproducible definition of the graphify stack.
#   graphify      - MCP server on 127.0.0.1:8770; multi-project via project_path, hot-reloads graph.json on change.
#   graphify-web  - static server for the interactive graph.html explorers, behind the gateway.
#   gateway       - Caddy: the explorers on the tailnet name over HTTPS and on 127.0.0.1:8771.
#   tailscale     - joins the tailnet inside the gateway's network namespace.
# Every project under the GitHub root is mounted read-only, so any project that has a
# graphify-out/graph.json is queryable/browsable without per-project config.
# Auto-rebuild is handled by per-session `graphify watch` (see hooks/ + scripts/watch-*.ps1).
services:
  graphify:
    image: graphify-server:latest
    build:
      context: ./image
      additional_contexts:
        # Pinned to the version the host-side watcher venv runs; change it only through `relock`.
        graphify-source: https://github.com/Graphify-Labs/graphify.git#f5d50adbd003dba310f4111c24e3d67c3a5ba141
    container_name: graphify-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8770:8080"
    environment:
      GRAPHIFY_API_KEY: ${GRAPHIFY_API_KEY}
    volumes:
      # Default/fallback graph (the demo) served when a tool call omits project_path.
      - "./graphify-out:/data"
      # All projects, read-only: a tool call with project_path=/projects/<lang>/<name>
      # resolves to <name>/graphify-out/graph.json on the host. Read-only because graphs
      # are generated by the host-side watcher, never by the container.
      - "${PROJECTS_ROOT:?set PROJECTS_ROOT in .env}:/projects:ro"
    command: ["/data/graph.json", "--transport", "http", "--host", "0.0.0.0", "--port", "8080"]

  # Static web UI. Both are mounted as sibling subpaths (a read-only mount can't host a
  # nested mountpoint), so:
  #   demo explorer     -> /demo/graph.html
  #   any project        -> /projects/<lang>/<name>/graphify-out/graph.html
  # Only those graphify-out folders are served (web/default.conf); the rest of the mount holds
  # every project's sources and config.env secrets.
  graphify-web:
    image: nginx:1.31.2-alpine
    container_name: graphify-web
    restart: unless-stopped
    volumes:
      - "./web/default.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./graphify-out:/usr/share/nginx/html/demo:ro"
      - "${PROJECTS_ROOT:?set PROJECTS_ROOT in .env}:/usr/share/nginx/html/projects:ro"

  gateway:
    extends: { file: gateway/gateway.yml, service: gateway }
    container_name: graphify-gateway
    ports:
      - "127.0.0.1:8771:8771"
    environment:
      TAILNET_HOST: ${GRAPHIFY_HOST:-graphify.invalid}
    depends_on:
      graphify-web:
        condition: service_started

  tailscale:
    extends: { file: gateway/gateway.yml, service: tailscale }
    container_name: graphify-tailscale
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-graphify}

x-volume-roles:
  tailscale-socket: rebuilt
  gateway-caddy-data: rebuilt

volumes:
  tailscale-socket:
  gateway-caddy-data:
