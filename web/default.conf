# The projects mount is the whole GitHub root, sources and config.env secrets included, so only the
# generated graphify-out folders are served.
server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex off;

    location ^~ /demo/ {
    }

    location ~ ^/projects/(.+/)?graphify-out/[^/]+$ {
    }

    location / {
        return 404;
    }
}
